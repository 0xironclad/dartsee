name: CI

on:
  push:
    branches: [master]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"
  pull_request:
    branches: [master]
    paths:
      - "server/**"
      - "client/**"
      - ".github/workflows/**"

jobs:
  server:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install dependencies
        # --ignore-scripts skips postinstall (pnpm rebuild better-sqlite3)
        # which requires a native compiler and is not needed for type checking
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run TypeScript type check
        run: pnpm run type-check

  client:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm run typecheck
